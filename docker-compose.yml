services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relaytiming
      POSTGRES_USER: relaytiming
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaytiming}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - "1883:1883"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/relaytiming
      SPRING_DATASOURCE_USERNAME: relaytiming
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-relaytiming}
      MQTT_BROKER_URL: tcp://mosquitto:1883
    depends_on:
      - postgres
      - mosquitto
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
  mosquitto-data:
